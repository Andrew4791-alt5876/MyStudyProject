[tool.poetry]
name = "pythonproject1"
version = "0.1.0"
description = ""
authors = ["Andrey Tiurin"]

[tool.poetry.dependencies]
python = "^3.13"
python-dotenv = "^1.2.1"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
poetry-core = "^2.3.1"
build = "==1.3.0"
certifi = "==2025.11.12"
charset-normalizer = "==3.4.4"
idna = "==3.11"
pandas-stubs = "==2.3.3.260113"
pip-tools = "==7.5.2"
pyproject-hooks = "==1.2.0"
requests = "==2.32.5"
setuptools = "==80.9.0"
types-pytz = "==2025.2.0.20251108"
types-requests = "==2.32.4.20250913"
urllib3 = "==2.6.2"
wheel = "==0.45.1"
xlrd = "==2.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)"
]
dev = [
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude = ".venv"
